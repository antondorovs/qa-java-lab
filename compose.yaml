name: qa-java-lab

services:
  browser:
    image: selenium/standalone-chrome:4.49.0-20260909
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "localhost", "--port", "4444"]
      interval: 5s
      timeout: 5s
      retries: 20
